spring.application.name=stockpulse

# H2 database configuration
spring.datasource.url=jdbc:h2:mem:stockpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Async config
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# CORS config
stockpulse.cors.allowed-origins=http://localhost:5173

# Commerce strategy selection
stockpulse.commerce.strategy=RULE

# LLM provider configuration
stockpulse.ai.provider=LITE
stockpulse.ai.model=qwen-cursor
stockpulse.ai.base-url=https://litellm-qc.zycus.net/v1
