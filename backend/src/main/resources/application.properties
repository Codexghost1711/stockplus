spring.application.name=stockpulse

# H2 database configuration
spring.datasource.url=jdbc:h2:mem:stockpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Async config
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# CORS config
stockpulse.cors.allowed-origins=http://localhost:5173

# Commerce strategy selection
stockpulse.commerce.strategy=${STOCKPULSE_COMMERCE_STRATEGY:RULE}

# LLM provider configuration
stockpulse.ai.provider=${STOCKPULSE_LLM_PROVIDER:UNKNOWN}
stockpulse.ai.model=${STOCKPULSE_LLM_MODEL:qwen-cursor}
stockpulse.ai.base-url=${STOCKPULSE_LLM_BASE_URL:https://litellm-qc.zycus.net/v1}
stockpulse.ai.api-key=${STOCKPULSE_LLM_API_KEY:}
stockpulse.ai.product=${STOCKPULSE_LLM_PRODUCT:PC1}
stockpulse.ai.cookie=${STOCKPULSE_LLM_COOKIE:}
